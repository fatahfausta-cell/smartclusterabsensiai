<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk Admin — Absensi Wajah</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ccircle cx='16' cy='12' r='5' fill='%23fff'/%3E%3Cpath d='M6 27c1.8-5 5.6-7.5 10-7.5S24.2 22 26 27' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css?v=3">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <span class="logo" style="width:34px;height:34px;border-radius:8px;background:var(--brand);display:inline-flex;align-items:center;justify-content:center;color:#fff" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <span>Absensi Wajah</span>
      </div>
      <h1>Masuk Admin</h1>
      <p class="sub">Panel pengelolaan peserta dan rekap kehadiran.</p>
      {% if error %}<div class="alert-error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-utama" style="width:100%" type="submit">Masuk</button>
      </form>
      <p style="margin-top:16px; font-size:13.5px; text-align:center;">
        <a href="/">&larr; Kembali ke halaman absensi</a>
      </p>
    </div>
  </div>
</body>
</html>
