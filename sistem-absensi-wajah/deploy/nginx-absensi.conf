# /etc/nginx/sites-available/absensi
# Reverse proxy ke waitress (127.0.0.1:5050).
# Catatan: setup_vps.sh otomatis mengganti "server_name _;" dengan nama
# domain Anda (atau nama sslip.io berbasis IP) sebelum memasang file ini.
server {
    listen 80;
    server_name _;

    client_max_body_size 16M;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
